# arXiv MCP Server — OpenAI Codex CLI
#
# Add this block to ~/.codex/config.toml (user-global)
# or .codex/config.toml in a trusted project directory.
#
# Requirements:
#   Node.js >= 22
#   Clone the repo and run `npm install` once:
#     git clone https://github.com/damionrashford/arxiv-mcp
#     cd arxiv-mcp && npm install
#
# Then replace /path/to/arxiv-mcp below with the actual clone path.

[mcp_servers.arxiv]
command = "node"
args = ["--experimental-strip-types", "/path/to/arxiv-mcp/server.ts"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"
required = false

# Per-tool approval overrides (all auto — these tools are read-only)
[mcp_servers.arxiv.tools.arxiv_search]
approval_mode = "auto"

[mcp_servers.arxiv.tools.arxiv_get_paper]
approval_mode = "auto"

[mcp_servers.arxiv.tools.arxiv_list_categories]
approval_mode = "auto"
